apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-dev
resources:
  - ../../base
labels:
  - pairs:
      env: dev
    includeTemplates: true
replicas:
  - name: demo-app
    count: 1
configMapGenerator:
  - name: demo-app-env
    literals:
      - APP_ENV=dev
      - LOG_LEVEL=debug
images:
  - name: ghcr.io/vijaymaddina/demo-app
    newTag: "5f42100"
