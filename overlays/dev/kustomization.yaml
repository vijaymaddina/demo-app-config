apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-dev
resources:
- ../../base
labels:
- includeTemplates: true
  pairs:
    env: dev
replicas:
- count: 1
  name: demo-app
configMapGenerator:
- literals:
  - APP_ENV=dev
  - LOG_LEVEL=debug
  name: demo-app-env
images:
- name: ghcr.io/vijaymaddina/demo-app
  newName: ghcr.io/vijaymaddina/demo-app
  newTag: 9eb8f7f
