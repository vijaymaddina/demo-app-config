apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-prod
resources:
  - ../../base
labels:
  - pairs:
      env: prod
    includeTemplates: true
replicas:
  - name: demo-app
    count: 3
patches:
  - path: resources-patch.yaml
configMapGenerator:
  - name: demo-app-env
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=warn
images:
  - name: ghcr.io/vijaymaddina/demo-app
    newTag: "5f42100"
